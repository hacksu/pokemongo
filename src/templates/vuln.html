<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokémon Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #f9f7f3, #d1e8ff);
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: #ef5350;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
    }

    .navbar-brand:hover {
      color: #ffcb05;
    }

    .login-card {
      max-width: 400px;
      margin: 50px auto;
      border-radius: 1rem;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }

    .login-card .card-header {
      background-color: #ffcb05;
      color: #2a75bb;
      font-weight: bold;
      text-align: center;
      font-size: 1.25rem;
      border-radius: 1rem 1rem 0 0;
    }

    .btn-login {
      background-color: #2a75bb;
      color: white;
      font-weight: bold;
    }

    .btn-login:hover {
      background-color: #1b4d7a;
      color: #ffcb05;
    }

    .form-control:focus {
      border-color: #2a75bb;
      box-shadow: 0 0 0 0.2rem rgba(42,117,187,.25);
    }

    .poke-icon {
      font-size: 1.2rem;
      color: #ef5350;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-lightning-charge-fill"></i> Pokémon Center</a>
    </div>
  </nav>

  <div class="container">
    {% if message %}
    <div class="alert alert-warning d-flex align-items-center shadow-sm rounded-4 mt-3" role="alert">
        <i class="bi bi-info-circle-fill me-2 text-primary"></i>
        <div class="fw-semibold text-primary">
        {{ message }}
        </div>
    </div>
    {% endif %}

    <div class="card login-card mt-5">
      <div class="card-header">
        <i class="bi bi-person-circle"></i> Trainer Login
      </div>
      <div class="card-body">
        <form action="/login" method="post">
          <div class="mb-3">
            <label for="username" class="form-label"><i class="bi bi-person poke-icon"></i> Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your trainer name" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label"><i class="bi bi-lock poke-icon"></i> Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-login"><i class="bi bi-box-arrow-in-right"></i> Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
