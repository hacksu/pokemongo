<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokémon App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f9f7f3, #d1e8ff);
      font-family: 'Segoe UI', sans-serif;
    }

    .nav-tabs .nav-link.active {
      background-color: #ffcb05;
      color: #2a75bb;
    }

    .nav-tabs .nav-link {
      color: #2a75bb;
    }

    .tab-content {
      background-color: white;
      border-radius: 0 0 10px 10px;
      padding: 20px;
      border: 1px solid #dee2e6;
      border-top: none;
    }

    .navbar {
      background-color: #ef5350;
    }

    .navbar-brand {
      color: white;
      font-weight: bold;
    }

    .navbar-brand:hover {
      color: #ffcb05;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-lightning-charge-fill"></i> Pokémon Center</a>
    </div>
  </nav>

  <div class="container mt-4">
    <ul class="nav nav-tabs" id="pokemonTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pokedex-tab" data-bs-toggle="tab" data-bs-target="#pokedex" type="button" role="tab">📘 Pokedex</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pc-tab" data-bs-toggle="tab" data-bs-target="#pc" type="button" role="tab">💾 My PC</button>
      </li>
    </ul>

    <div class="tab-content" id="pokemonTabsContent">
      <div class="tab-pane fade show active" id="pokedex" role="tabpanel">
        <h3>Pokedex</h3>
        <p>View all discovered Pokémon here!</p>
        <!-- Add your pokedex content here -->
      </div>
      <div class="tab-pane fade" id="pc" role="tabpanel">
        <h3>My PC</h3>
        <p>These are the Pokémon you've caught!</p>
        <!-- Add your PC content here -->
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
